name: Deploy Gemini Gateway Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gemini-gateway
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Deploy to Cloudflare Workers
        env:
          ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$ACTIONS_TOKEN" ]]; then
            npm run deploy
            exit
          fi

          secrets_file="$(mktemp "$RUNNER_TEMP/gemini-gateway.XXXXXXXX.json")"
          trap 'rm -f "$secrets_file"' EXIT
          node -e 'process.stdout.write(JSON.stringify({ GITHUB_ACTIONS_TOKEN: process.env.ACTIONS_TOKEN }))' > "$secrets_file"
          npm run deploy -- --secrets-file "$secrets_file"
